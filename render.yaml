# Blueprint Render : crée le service web + la base PostgreSQL gratuite
services:
  - type: web
    name: edugest-cloud
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: SESSION_SECRET
        generateValue: true
      - key: ANNEE_SCOLAIRE
        value: 2026-2027
      - key: AUTO_INIT_DB
        value: "true"
      - key: SEED_DEMO_DATA
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: edugest-db
          property: connectionString
databases:
  - name: edugest-db
    plan: free
    databaseName: edugest
    user: edugest
